<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <title>Happy birthday</title>
    <!-- Tailwind CSS is bundled locally via @tailwindcss/vite; MediaPipe scripts load on-demand -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital@1&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #070b18;
        font-family: 'Noto Serif SC', 'Playfair Display', serif;
      }
      canvas {
        touch-action: none;
      }
      .font-display {
        font-family: 'Playfair Display', 'Noto Serif SC', serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.03);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 183, 197, 0.4);
        border-radius: 2px;
      }
      @keyframes shimmer {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      .shimmer {
        animation: shimmer 3s ease-in-out infinite;
      }
      @keyframes snowfall-gradient {
        0% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 0% 200%;
        }
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/index-BeE7YxDE.css" />
    <link rel="stylesheet" href="./wish-layer.css" />
    <script type="module" crossorigin src="./assets/index-CZPyPNxJ.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Layered wish + blow (on top of particle gestures; does not replace them) -->
    <div id="wish-root" aria-live="polite">
      <div id="wish-banner">
        <p id="wish-greeting">Happy birthday!</p>
        <p id="wish-prompt"></p>
        <p id="wish-hint"></p>
        <button type="button" id="wish-blow-btn" hidden>Blow out candle</button>
      </div>

      <div id="wish-note-layer">
        <div>
          <div id="wish-note-card">
            <div class="note-inner">
              <div class="wish-note-face">
                <div id="wish-note-message"></div>
                <div id="wish-note-photo-wrap">
                  <img id="wish-note-photo" alt="" />
                </div>
              </div>
              <div class="wish-note-face back">
                <div id="wish-note-caption"></div>
              </div>
            </div>
          </div>
          <div class="wish-note-actions">
            <button type="button" id="wish-note-close">Tuck note</button>
            <button type="button" id="wish-note-gallery">Cake Photos</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/wish-layer.js"></script>
  </body>
</html>
